name: Build MAUI Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # --------------------------------------------------
    # 1. Checkout source code
    # --------------------------------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # --------------------------------------------------
    # 2. Auto bump Android versionCode
    # --------------------------------------------------
    - name: Auto bump Android versionCode
      shell: pwsh
      run: |
        [xml]$xml = Get-Content *.csproj
        $pg = $xml.Project.PropertyGroup | Where-Object { $_.ApplicationVersion }
        if (-not $pg) {
          Write-Error "Không tìm thấy ApplicationVersion"
          exit 1
        }

        $old = [int]$pg.ApplicationVersion
        $new = $old + 1
        $pg.ApplicationVersion = $new
        $xml.Save((Resolve-Path "*.csproj").Path)

        Write-Host "✅ Android versionCode bumped: $old -> $new"

    # --------------------------------------------------
    # 3. Read .NET SDK version from global.json
    # --------------------------------------------------
    - name: Read .NET SDK version
      shell: pwsh
      run: |
        $json = Get-Content global.json | ConvertFrom-Json
        $majorMinor = $json.sdk.version.Substring(0, $json.sdk.version.LastIndexOf("."))
        echo "SDK_VERSION=$majorMinor.x" >> $env:GITHUB_ENV

    # --------------------------------------------------
    # 4. Setup .NET SDK
    # --------------------------------------------------
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.SDK_VERSION }}

    # --------------------------------------------------
    # 5. Install MAUI workload
    # --------------------------------------------------
    - name: Install MAUI workload
      run: dotnet workload install maui

    # --------------------------------------------------
    # 6. Detect Android TargetFramework
    # --------------------------------------------------
    - name: Detect Android TargetFramework
      shell: pwsh
      run: |
        $csproj = Get-ChildItem *.csproj | Select-Object -First 1
        [xml]$xml = Get-Content $csproj.FullName

        $tfs = @()
        foreach ($pg in $xml.Project.PropertyGroup) {
          if ($pg.TargetFramework)  { $tfs += $pg.TargetFramework }
          if ($pg.TargetFrameworks) { $tfs += ($pg.TargetFrameworks -split ';') }
        }

        $android = $tfs | Where-Object { $_ -match "android" } | Select-Object -First 1
        echo "TFM=$android" >> $env:GITHUB_ENV

    # --------------------------------------------------
    # 7. BUILD & PUBLISH APK  ✅✅✅ (ĐÂY LÀ NƠI RA FILE APK)
    # --------------------------------------------------
    - name: Publish APK
      run: |
        dotnet publish `
          -c Release `
          -f $env:TFM `
          -p:AndroidPackageFormat=apk `
          -p:PublishTrimmed=true `
          -p:AndroidEnableResourceShrinking=false 

    # --------------------------------------------------
    # 8. UPLOAD APK ĐỂ TẢI VỀ (Artifacts)
    # --------------------------------------------------
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/Release/**/publish/*.apk