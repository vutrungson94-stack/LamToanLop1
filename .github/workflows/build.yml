name: Build MAUI Android (VIP PRO)

permissions:
  contents: write
  actions: write

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      package_format:
        description: 'Chọn định dạng xuất bản (apk hoặc aab)'
        required: true
        default: 'apk'
        type: choice
        options: [apk, aab]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ==========================================================
  # NHÁNH CHỦ ĐẠO: ANDROID (Tạo Release trước)
  # ==========================================================
  build-android:
    name: 📱 Build & Release Android
    runs-on: ubuntu-latest
    steps:
    - name: 🕒 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Control global.json
      if: hashFiles('global.json') != ''
      shell: pwsh
      run: |
        $json = Get-Content global.json | ConvertFrom-Json
        $json.sdk.rollForward = "patch"
        $json | ConvertTo-Json -Depth 10 | Set-Content global.json
        Write-Host "✅ Đã cấu hình global.json!" -ForegroundColor Cyan

    - name: 🛠️  Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        global-json-file: ${{ hashFiles('global.json') != '' && 'global.json' || '' }}

    - name: 🕒 Cache NuGet (Android)
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-android-${{ hashFiles('**/*.csproj') }}

    - name: ⚡ Install MAUI Android
      run: dotnet workload install maui-android
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: true
        DOTNET_NOLOGO: true
        
    - name: 📦 Build Android
      shell: pwsh
      run: |
        $csproj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
        [xml]$xml = Get-Content $csproj.FullName
        # SỬA LỖI: Match trực tiếp với 'android' vì không có matrix ở đây
        $tfm = $xml.Project.PropertyGroup 
          | Foreach-Object { $_.TargetFrameworks } 
          | Where-Object { $_ -match 'android' } 
          | Select-Object -First 1
        
        if ([string]::IsNullOrWhiteSpace($tfm)) {
          Write-Error "❌ Không tìm thấy TargetFramework android trong .csproj"
          exit 1
        }  

        $format = "${{ github.event.inputs.package_format }}"
        if ([string]::IsNullOrWhiteSpace($format)) { $format = "apk" }
        
        dotnet publish -c Release -f $tfm -p:RunAOTCompilation=true -p:PublishTrimmed=true -p:AndroidPackageFormat=$format

    - name: 📁 Organize Android Artifacts
      if: success()
      shell: pwsh
      run: |
        $baseDir = "publish-output"
        $platformDir = "$baseDir/android"
        New-Item -ItemType Directory -Path "$platformDir/apk", "$platformDir/aab" -Force | Out-Null
        Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -match 'apk|aab' -and $_.FullName -notlike "*$baseDir*" } | ForEach-Object {
            if ($_.Extension -eq ".apk") { Move-Item $_.FullName "$platformDir/apk" -Force }
            elseif ($_.Extension -eq ".aab") { Move-Item $_.FullName "$platformDir/aab" -Force }
        }

    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-files
        path: publish-output/

    - name: 🚀 Create GitHub Release (Android First)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: 📦 Full Build #${{ github.run_number }}
        files: publish-output/**
        generate_release_notes: true

  # ==========================================================
  # NHÁNH PHỤ: APPLE (Đính kèm thêm vào Release đã tạo)
  # ==========================================================
  build-apple:
    name: 🍎 ${{ matrix.platform }}
    needs: build-android
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, maccatalyst]
    runs-on: macos-latest
    steps:
    - name: 🕒 Checkout code
      uses: actions/checkout@v4

    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        global-json-file: ${{ hashFiles('global.json') != '' && 'global.json' || '' }}

    - name: ⚡ Install MAUI ${{ matrix.platform }}
      run: dotnet workload install maui-${{ matrix.platform }} --no-history --nologo
      
    - name: 📦 Build Apple
      run: dotnet publish -c Release -f net9.0-${{ matrix.platform }} -p:RunAOTCompilation=true -p:PublishTrimmed=true
      
    - name: 📁 Organize Apple Artifacts
      if: success()
      shell: pwsh
      run: |
        $baseDir = "publish-output"
        $platformDir = "$baseDir/${{ matrix.platform }}"
        New-Item -ItemType Directory -Path "$platformDir/apple" -Force | Out-Null
        Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -match 'pkg|dmg|app' -and $_.FullName -notlike "*$baseDir*" } | ForEach-Object {
            Move-Item $_.FullName "$platformDir/apple" -Force
        }

    - name: 🚀 Update Release with Apple Files
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }} # Dùng chung tag để đính kèm vào bản Android đã tạo
        files: publish-output/**