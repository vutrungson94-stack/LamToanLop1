name: Build MAUI Android (APK + AAB)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # [PRO TIP]: Thêm timeout để không bị trừ tiền vô ích nếu build bị treo
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    # 1. Caching thông minh (Đã tối ưu)
    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    # 2. Setup .NET dùng phiên bản chính xác từ global.json
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Install MAUI workload
      run: dotnet workload install maui

    # 3. Dynamic Build (Tối ưu hóa command line)
    - name: Build and Publish
      shell: pwsh
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        # Đọc TFM
        [xml]$xml = Get-Content *.csproj
        $tfm = $xml.Project.PropertyGroup.TargetFrameworks -split ';' | Select-Object -First 1
        
        $args = @(
            "-c", "Release",
            "-f", $tfm,
            "-p:AndroidPackageFormat=apk;aab",
            "-p:PublishTrimmed=false",
            "-p:AndroidLinkMode=None",
            "-p:AndroidLocales=vi;en"
        )

        # Thêm thông tin ký nếu có keystore
        if (-not [string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            $bytes = [System.Convert]::FromBase64String($env:KEYSTORE_BASE64)
            [IO.File]::WriteAllBytes("android.keystore", $bytes)
            
            $args += "-p:AndroidSigningKeyStore=android.keystore"
            $args += "-p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            $args += "-p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            $args += "-p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}"
        }

        dotnet publish @args

    # 4. Gom Artifacts (Cực kỳ quan trọng để không bị lỗi đường dẫn)
    - name: Prepare Artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "publish-output"
        Get-ChildItem -Path bin/Release -Recurse -Filter "*.*" | Where-Object { $_.Extension -match 'apk|aab' } | Copy-Item -Destination "publish-output"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: publish-output/*

    # 5. Release tự động (Chỉ chạy khi build thành công)
    - name: Create GitHub Release
      if: success() && startsWith(github.ref, 'refs/heads/main')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Build ${{ github.run_number }}
        files: publish-output/*