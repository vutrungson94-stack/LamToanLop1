name: Build MAUI Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # --------------------------------------------------
    # 1. Checkout source code
    # --------------------------------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # --------------------------------------------------
    # 2. Auto bump Android versionCode (bắt buộc cho Play)
    # --------------------------------------------------
    - name: Auto bump Android versionCode
      shell: pwsh
      run: |
        [xml]$xml = Get-Content *.csproj
        $pg = $xml.Project.PropertyGroup | Where-Object { $_.ApplicationVersion }
        if (-not $pg) {
          Write-Error "❌ Không tìm thấy ApplicationVersion trong csproj"
          exit 1
        }

        $old = [int]$pg.ApplicationVersion
        $new = $old + 1
        $pg.ApplicationVersion = $new
        $xml.Save((Resolve-Path "*.csproj").Path)

        Write-Host "✅ Android versionCode bumped: $old -> $new"

    # --------------------------------------------------
    # 3. Đọc .NET SDK version từ global.json (NGUỒN CHUẨN)
    # --------------------------------------------------
    - name: Read .NET version from global.json
      shell: pwsh
      run: |
        if (-not (Test-Path global.json)) {
          Write-Error "❌ Không tìm thấy global.json"
          exit 1
        }

        $json = Get-Content global.json | ConvertFrom-Json
        $sdk = $json.sdk.version

        # Lấy major.minor.x (ví dụ: 9.0.x)
        $majorMinor = $sdk.Substring(0, $sdk.LastIndexOf("."))

        echo "SDK_VERSION=$majorMinor.x" >> $env:GITHUB_ENV
