name: 🚀 Build MAUI — VIP PRO

# ─────────────────────────────────────────────────────────────
#  Secrets tuỳ chọn (không cần thì bỏ qua, build vẫn chạy):
#
#  Android  : KEYSTORE_BASE64  KEYSTORE_PASSWORD  KEY_ALIAS  KEY_PASSWORD
#  Apple    : APPLE_CERT_P12   APPLE_CERT_PASS    APPLE_PROV_PROFILE
#  Windows  : WIN_CERT_PFX     WIN_CERT_PASS
# ─────────────────────────────────────────────────────────────

permissions:
  contents: write
  actions:  write

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      package_format:
        description: "Android — APK hay AAB?"
        required: true
        default: apk
        type: choice
        options: [apk, aab]
      platforms:
        description: "Build nền tảng nào?"
        required: true
        default: android
        type: choice
        options:
          - android
          - android+apple
          - android+windows
          - all
  # Khai báo secrets để linter không cảnh báo "Context access might be invalid"
  # required: false → không bắt buộc, workflow vẫn chạy khi không có secret
  workflow_call:
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      APPLE_CERT_P12:
        required: false
      APPLE_CERT_PASS:
        required: false
      APPLE_PROV_PROFILE:
        required: false
      WIN_CERT_PFX:
        required: false
      WIN_CERT_PASS:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_VERSION: "10.0.x"

# ══════════════════════════════════════════════════════════════
# JOB 1 — Quét .csproj, phát hiện TFM tất cả nền tảng
# ══════════════════════════════════════════════════════════════
jobs:
  detect:
    name: 🔎 Detect project & TFMs
    runs-on: ubuntu-latest
    outputs:
      csproj_path:       ${{ steps.scan.outputs.csproj_path }}
      android_tfm:       ${{ steps.scan.outputs.android_tfm }}
      windows_tfm:       ${{ steps.scan.outputs.windows_tfm }}
      apple_count:       ${{ steps.scan.outputs.apple_count }}
      apple_matrix_json: ${{ steps.scan.outputs.apple_matrix_json }}

    steps:
      - name: 🕒 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Scan .csproj & TFMs
        id: scan
        shell: pwsh
        run: |
          # ── helpers ──────────────────────────────────────────
          function Get-CsprojTfms([string]$p) {
            [xml]$x = Get-Content -LiteralPath $p
            $list   = [System.Collections.Generic.List[string]]::new()
            foreach ($pg in @($x.Project.PropertyGroup)) {
              if ($null -eq $pg) { continue }
              foreach ($node in @($pg.ChildNodes)) {
                if ($node.Name -eq 'TargetFrameworks' -or $node.Name -eq 'TargetFramework') {
                  $blob = $node.InnerText.Trim()
                  foreach ($p2 in ($blob -split ';')) {
                    $t = $p2.Trim()
                    if (-not $t -or $t -match '^\$\(') { continue }
                    foreach ($piece in ($t -split '\s+')) {
                      if ($piece -and $piece -notmatch '^\$\(') { [void]$list.Add($piece) }
                    }
                  }
                }
              }
            }
            return ,@($list | Select-Object -Unique)
          }
          function Pick-Tfm([string[]]$tfms, [string]$pattern) {
            foreach ($t in $tfms) {
              $m = [regex]::Match($t, $pattern)
              if ($m.Success) { return $m.Value }
            }
            return $null
          }

          # ── tìm .csproj chính ────────────────────────────────
          $all = Get-ChildItem . -Recurse -Filter *.csproj -File |
            Where-Object { $_.FullName -notmatch '[\\/](obj|bin|packages|node_modules)[\\/]' -and $_.Name -notmatch '\.Tests\.' } |
            Sort-Object FullName

          $main = $null
          foreach ($c in $all) {
            $raw  = Get-Content $c.FullName -Raw -EA SilentlyContinue
            $tfms = Get-CsprojTfms $c.FullName
            if ($tfms | Where-Object { $_ -match 'android' }) {
              if ($raw -match '<UseMaui>\s*true\s*</UseMaui>' -or $raw -match 'net[0-9.]+-android') {
                $main = $c; break
              }
            }
          }
          if (-not $main) {
            foreach ($c in $all) {
              $tfms = Get-CsprojTfms $c.FullName
              if ($tfms | Where-Object { $_ -match 'android|ios|maccatalyst|windows' }) { $main = $c; break }
            }
          }
          if (-not $main) { Write-Error "❌ Không tìm thấy .csproj MAUI!"; exit 1 }

          $tfms      = Get-CsprojTfms $main.FullName
          $androidTfm = Pick-Tfm $tfms 'net[0-9]+\.[0-9]+-android[0-9.]*'
          $winTfm     = Pick-Tfm $tfms 'net[0-9]+\.[0-9]+-windows[0-9.]*'
          $iosTfm     = Pick-Tfm $tfms 'net[0-9]+\.[0-9]+-ios[0-9.]*'
          $macTfm     = Pick-Tfm $tfms 'net[0-9]+\.[0-9]+-maccatalyst[0-9.]*'

          if (-not $androidTfm) { Write-Error "❌ Không có TFM android trong $($main.Name)!"; exit 1 }

          $appleRows = [System.Collections.Generic.List[hashtable]]::new()
          if ($iosTfm) { $appleRows.Add(@{ platform = 'ios';          tfm = $iosTfm }) }
          if ($macTfm) { $appleRows.Add(@{ platform = 'maccatalyst';  tfm = $macTfm }) }

          $rel        = [System.IO.Path]::GetRelativePath((Get-Location).Path, $main.FullName) -replace '\\','/'
          $appleCount = $appleRows.Count
          $appleJson  = if ($appleCount -eq 0) { '[]' } else { ConvertTo-Json @($appleRows.ToArray()) -Compress -Depth 5 }

          Write-Host "csproj    : $rel"
          Write-Host "android   : $androidTfm"
          Write-Host "windows   : $(if ($winTfm) { $winTfm } else { '—' })"
          Write-Host "iOS       : $(if ($iosTfm)  { $iosTfm }  else { '—' })"
          Write-Host "catalyst  : $(if ($macTfm)  { $macTfm }  else { '—' })"

          "csproj_path=$rel"              | Out-File $env:GITHUB_OUTPUT -Append
          "android_tfm=$androidTfm"       | Out-File $env:GITHUB_OUTPUT -Append
          "windows_tfm=$winTfm"           | Out-File $env:GITHUB_OUTPUT -Append
          "apple_count=$appleCount"       | Out-File $env:GITHUB_OUTPUT -Append
          $eof = 'APPLE_EOF'
          "apple_matrix_json<<$eof"       | Out-File $env:GITHUB_OUTPUT -Append
          $appleJson                      | Out-File $env:GITHUB_OUTPUT -Append
          $eof                            | Out-File $env:GITHUB_OUTPUT -Append

# ══════════════════════════════════════════════════════════════
# JOB 2 — Build Android (APK / AAB, ký hoặc không ký)
# ══════════════════════════════════════════════════════════════
  build-android:
    name: 📱 Android (${{ github.event.inputs.package_format || 'apk' }})
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Patch global.json (rollForward)
        if: hashFiles('global.json') != ''
        shell: pwsh
        run: |
          $j = Get-Content global.json | ConvertFrom-Json
          if (-not $j.sdk) { $j | Add-Member sdk @{} NoteProperty }
          $j.sdk.rollForward = 'latestMinor'
          $j | ConvertTo-Json -Depth 10 | Set-Content global.json
          Write-Host "✅ global.json patched"

      - name: 🛠️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🕒 Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj','**/global.json') }}
          restore-keys: nuget-android-

      - name: ⚡ Install MAUI Android workload
        run: dotnet workload install maui-android

      # ── Phát hiện ký số Android ─────────────────────────────
      - name: 🔑 Detect Android signing
        id: signing
        env:
          _KS: ${{ secrets.KEYSTORE_BASE64 }}
        shell: pwsh
        run: |
          $has = -not [string]::IsNullOrWhiteSpace($env:_KS)
          "enabled=$($has.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          if ($has) {
            Write-Host "✅ Keystore secret found → build SIGNED release" -ForegroundColor Green
          } else {
            Write-Host "⚠️  No keystore secret   → build UNSIGNED (debug-signed)" -ForegroundColor Yellow
            Write-Host "   (Thêm secret KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD để ký release)" -ForegroundColor DarkGray
          }

      # ── Build ───────────────────────────────────────────────
      - name: 📦 Build Android
        id: build
        shell: pwsh
        env:
          CSPROJ:       ${{ needs.detect.outputs.csproj_path }}
          ANDROID_TFM:  ${{ needs.detect.outputs.android_tfm }}
          SIGNING_ON:   ${{ steps.signing.outputs.enabled }}
          _KS_B64:      ${{ secrets.KEYSTORE_BASE64 }}
          _KS_PASS:     ${{ secrets.KEYSTORE_PASSWORD }}
          _KEY_ALIAS:   ${{ secrets.KEY_ALIAS }}
          _KEY_PASS:    ${{ secrets.KEY_PASSWORD }}
        run: |
          $csproj = Resolve-Path $env:CSPROJ
          $tfm    = $env:ANDROID_TFM
          $fmt    = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
                      "${{ github.event.inputs.package_format }}"
                    } else { 'apk' }
          if (-not $fmt) { $fmt = 'apk' }

          $args = @('publish', $csproj,
            '-c', 'Release', '-f', $tfm,
            "-p:AndroidPackageFormat=$fmt",
            '--nologo')

          if ($env:SIGNING_ON -eq 'true') {
            $ksPath = Join-Path $env:RUNNER_TEMP 'release.keystore'
            [IO.File]::WriteAllBytes($ksPath, [Convert]::FromBase64String($env:_KS_B64))
            $args += @(
              "-p:AndroidSigningKeyStore=$ksPath",
              "-p:AndroidSigningStorePass=$($env:_KS_PASS)",
              "-p:AndroidSigningKeyAlias=$($env:_KEY_ALIAS)",
              "-p:AndroidSigningKeyPass=$($env:_KEY_PASS)"
            )
            Write-Host "🔏 Signing with release keystore…" -ForegroundColor Cyan
          } else {
            Write-Host "📦 Building unsigned…" -ForegroundColor Yellow
          }

          & dotnet @args
          if ($LASTEXITCODE -ne 0) { throw "Build failed (exit $LASTEXITCODE)" }

      # ── Thu thập artifact ────────────────────────────────────
      - name: 📁 Collect Android artifacts
        shell: pwsh
        env:
          SIGNING_ON: ${{ steps.signing.outputs.enabled }}
        run: |
          $outDir = 'publish-output/android'
          New-Item -ItemType Directory -Force $outDir | Out-Null

          $candidates = Get-ChildItem . -Recurse -File |
            Where-Object {
              $_.Extension -in '.apk','.aab' -and
              $_.FullName  -notmatch '[\\/](publish-output|packages|node_modules)[\\/]'
            }

          if ($env:SIGNING_ON -eq 'true') {
            # Chỉ lấy file ĐÃ KÝ bằng release keystore
            # dotnet MAUI đặt tên: *-Signed.apk hoặc *-release.apk
            # Loại bỏ file unsigned/debug từ intermediate
            $files = $candidates | Where-Object {
              $_.Name -notmatch '-unsigned' -and
              $_.FullName -notmatch '[\\/](obj)[\\/]'
            }
            Write-Host "🔏 Collecting SIGNED artifacts only:" -ForegroundColor Green
          } else {
            # Chỉ lấy file CHƯA KÝ — loại bỏ file có -Signed (nếu có)
            $files = $candidates | Where-Object {
              $_.FullName -notmatch '[\\/](obj)[\\/]'
            }
            Write-Host "📦 Collecting UNSIGNED artifacts only:" -ForegroundColor Yellow
          }

          $count = 0
          foreach ($f in $files) {
            $dest = Join-Path $outDir $f.Name
            # Tránh ghi đè nhầm nếu trùng tên
            if (Test-Path $dest) { $dest = Join-Path $outDir "$($f.BaseName)-$([IO.Path]::GetRandomFileName().Split('.')[0])$($f.Extension)" }
            Copy-Item $f.FullName $dest -Force
            Write-Host "  ✅ $($f.Name)  [$([math]::Round($f.Length/1MB,2)) MB]" -ForegroundColor Green
            $count++
          }

          if ($count -eq 0) {
            Write-Warning "⚠️  No Android artifacts found — check build logs!"
          } else {
            Write-Host "`n📊 Total: $count file(s)" -ForegroundColor Cyan
          }

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: publish-output/android/
          if-no-files-found: warn

      - name: 🚀 Create GitHub Release (Android)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "📦 Build #${{ github.run_number }}"
          body: |
            ## 📱 Android
            | | |
            |---|---|
            | **Ký số** | ${{ steps.signing.outputs.enabled == 'true' && '🔏 Signed (release keystore)' || '⚠️ Unsigned / debug-signed' }} |
            | **Định dạng** | `${{ github.event.inputs.package_format || 'apk' }}` |
            | **Trigger** | `${{ github.event_name }}` by **${{ github.actor }}** |
            | **Commit** | `${{ github.sha }}` |
          files: publish-output/android/*
          generate_release_notes: true

# ══════════════════════════════════════════════════════════════
# JOB 3 — Build Apple (iOS / Mac Catalyst)
# ══════════════════════════════════════════════════════════════
  build-apple:
    name: 🍎 ${{ matrix.platform }}
    needs: [detect, build-android]
    if: |
      needs.detect.outputs.apple_count != '0' &&
      (
        github.event.inputs.platforms == '' ||
        contains(github.event.inputs.platforms, 'apple') ||
        github.event.inputs.platforms == 'all'
      )
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.apple_matrix_json) }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Patch global.json
        if: hashFiles('global.json') != ''
        shell: pwsh
        run: |
          $j = Get-Content global.json | ConvertFrom-Json
          if (-not $j.sdk) { $j | Add-Member sdk @{} NoteProperty }
          $j.sdk.rollForward = 'latestMinor'
          $j | ConvertTo-Json -Depth 10 | Set-Content global.json

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: ⚡ Install MAUI ${{ matrix.platform }}
        run: dotnet workload install maui-${{ matrix.platform }}

      # ── Phát hiện ký số Apple ────────────────────────────────
      - name: 🔑 Detect Apple signing
        id: signing
        env:
          _CERT:    ${{ secrets.APPLE_CERT_P12 }}
          _PROFILE: ${{ secrets.APPLE_PROV_PROFILE }}
        shell: pwsh
        run: |
          $has = (-not [string]::IsNullOrWhiteSpace($env:_CERT)) -and
                 (-not [string]::IsNullOrWhiteSpace($env:_PROFILE))
          "enabled=$($has.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host $(if ($has) { "✅ Apple certs found → SIGNED build" } else { "⚠️  No Apple certs → UNSIGNED/simulator build" })

      # ── Cài cert + provisioning profile ────────────────────
      - name: 🔑 Install Apple signing assets
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12:  ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASS: ${{ secrets.APPLE_CERT_PASS }}
          PROV_PROF: ${{ secrets.APPLE_PROV_PROFILE }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          KEYCHAIN=/tmp/build.keychain
          security create-keychain -p ""        "$KEYCHAIN"
          security default-keychain -s          "$KEYCHAIN"
          security unlock-keychain  -p ""       "$KEYCHAIN"
          security import /tmp/cert.p12 -k      "$KEYCHAIN" -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROV_PROF" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: 📦 Build Apple
        shell: pwsh
        env:
          CSPROJ:     ${{ needs.detect.outputs.csproj_path }}
          TFM:        ${{ matrix.tfm }}
          SIGNING_ON: ${{ steps.signing.outputs.enabled }}
          PLATFORM:   ${{ matrix.platform }}
        run: |
          $csproj = Resolve-Path $env:CSPROJ
          $tfm    = $env:TFM
          Write-Host "✅ $csproj  ($tfm)"

          $args = @('publish', $csproj, '-c', 'Release', '-f', $tfm, '--nologo')
          
          # Đóng gói .ipa nếu là iOS
          if ($env:PLATFORM -eq 'ios') {
            $args += @('-r', 'ios-arm64', '-p:ArchiveOnBuild=true')
          }
          
          if ($env:SIGNING_ON -ne 'true') {
            # Unsigned / simulator
            $args += '-p:CodesignRequireProvisioningProfile=false'
          }
          & dotnet @args
          if ($LASTEXITCODE -ne 0) { throw "Apple build failed" }

      - name: 📁 Collect Apple artifacts
        shell: pwsh
        env:
          PLATFORM:   ${{ matrix.platform }}
          SIGNING_ON: ${{ steps.signing.outputs.enabled }}
        run: |
          $outDir = "publish-output/$env:PLATFORM"
          New-Item -ItemType Directory -Force $outDir | Out-Null

          $exts = @('.ipa', '.app', '.pkg', '.dmg')
          $candidates = Get-ChildItem . -Recurse -File |
            Where-Object { $_.Extension -in $exts -and $_.FullName -notmatch '[\\/](publish-output|packages)[\\/]' }

          if ($env:SIGNING_ON -eq 'true') {
            $files = $candidates | Where-Object { $_.Extension -ne '.app' }   # .app = simulator only
            Write-Host "🔏 Collecting SIGNED Apple artifacts" -ForegroundColor Green
          } else {
            $files = $candidates
            Write-Host "📦 Collecting UNSIGNED Apple artifacts" -ForegroundColor Yellow
          }

          foreach ($f in $files) {
            Copy-Item $f.FullName (Join-Path $outDir $f.Name) -Force
            Write-Host "  ✅ $($f.Name)" -ForegroundColor Green
          }

      - name: 🚀 Update Release with Apple files
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: publish-output/${{ matrix.platform }}/*

# ══════════════════════════════════════════════════════════════
# JOB 4 — Build Windows (MSIX)
# ══════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Windows MSIX
    needs: [detect, build-android]
    if: |
      needs.detect.outputs.windows_tfm != '' &&
      (
        contains(github.event.inputs.platforms, 'windows') ||
        github.event.inputs.platforms == 'all'
      )
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Patch global.json
        if: hashFiles('global.json') != ''
        shell: pwsh
        run: |
          $j = Get-Content global.json | ConvertFrom-Json
          if (-not $j.sdk) { $j | Add-Member sdk @{} NoteProperty }
          $j.sdk.rollForward = 'latestMinor'
          $j | ConvertTo-Json -Depth 10 | Set-Content global.json

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: ⚡ Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: 🔑 Detect Windows signing
        id: signing
        env:
          _PFX: ${{ secrets.WIN_CERT_PFX }}
        shell: pwsh
        run: |
          $has = -not [string]::IsNullOrWhiteSpace($env:_PFX)
          "enabled=$($has.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host $(if ($has) { "✅ PFX cert found → SIGNED MSIX" } else { "⚠️  No PFX → UNSIGNED MSIX" })

      - name: 📦 Build Windows
        shell: pwsh
        env:
          CSPROJ:      ${{ needs.detect.outputs.csproj_path }}
          WIN_TFM:     ${{ needs.detect.outputs.windows_tfm }}
          SIGNING_ON:  ${{ steps.signing.outputs.enabled }}
          _PFX_B64:    ${{ secrets.WIN_CERT_PFX }}
          _PFX_PASS:   ${{ secrets.WIN_CERT_PASS }}
        run: |
          $csproj = Resolve-Path $env:CSPROJ
          $tfm    = $env:WIN_TFM

          $args = @('publish', $csproj, '-c', 'Release', '-f', $tfm, '--nologo',
                    '-p:WindowsPackageType=MSIX', '-p:GenerateAppxPackageOnBuild=true')

          if ($env:SIGNING_ON -eq 'true') {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'win_cert.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:_PFX_B64))
            $args += @(
              "-p:PackageCertificateKeyFile=$pfxPath",
              "-p:PackageCertificatePassword=$($env:_PFX_PASS)"
            )
            Write-Host "🔏 Signing Windows MSIX…" -ForegroundColor Cyan
          }

          & dotnet @args
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

      - name: 📁 Collect Windows artifacts
        shell: pwsh
        env:
          SIGNING_ON: ${{ steps.signing.outputs.enabled }}
        run: |
          $outDir = 'publish-output/windows'
          New-Item -ItemType Directory -Force $outDir | Out-Null

          $candidates = Get-ChildItem . -Recurse -File |
            Where-Object { $_.Extension -in '.msix','.msixbundle','.appx','.appxbundle' -and
                           $_.FullName -notmatch '[\\/](publish-output|packages|obj)[\\/]' }

          if ($env:SIGNING_ON -eq 'true') {
            # Chỉ lấy file đã ký: loại bỏ *_Test* hoặc file chưa ký
            $files = $candidates | Where-Object { $_.Name -notmatch '_Test|Dependencies' }
            Write-Host "🔏 Collecting SIGNED MSIX only" -ForegroundColor Green
          } else {
            $files = $candidates
            Write-Host "📦 Collecting UNSIGNED MSIX" -ForegroundColor Yellow
          }

          foreach ($f in $files) {
            Copy-Item $f.FullName (Join-Path $outDir $f.Name) -Force
            Write-Host "  ✅ $($f.Name)" -ForegroundColor Green
          }

      - name: 🚀 Update Release with Windows files
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: publish-output/windows/*
