name: Build MAUI Android (VIP PRO)

permissions:
  contents: write # Cho phép tạo release và upload artifact
  actions: write # Cho phép workflow tự động tạo tag và release

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Cho phép bấm nút Build thủ công từ GitHub hoặc qua script gbuild
    inputs:
      package_format:
        description: 'Chọn định dạng xuất bản (apk hoặc aab)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30 # Tự động ngắt nếu treo quá 30p để tiết kiệm tài nguyên

    steps:
    # ==========================================================
    # 1. Khởi tạo môi trường
    # ==========================================================
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Lấy toàn bộ lịch sử để hỗ trợ việc đánh số version nếu cần

    # [NÂNG CẤP]: Chỉ chạy nếu file global.json tồn tại để tránh lỗi với các project không dùng global.json
    - name: 🎩 Control global.json
      if: hashFiles('global.json') != '' # Chỉ chạy nếu có file global.json trong repo
      shell: pwsh
      run: |
        # Đọc file global.json hiện tại
        $json = Get-Content global.json | ConvertFrom-Json
        
        # Bắt máy chủ GitHub bỏ qua latestMajor, ép dùng đúng bản vá (patch) của .NET 9
        $json.sdk.rollForward = "patch"
        $json.sdk.allowPrerelease = $false
        
        # Lưu đè lại file (chỉ có tác dụng trên máy chủ ảo lúc đang build)
        $json | ConvertTo-Json -Depth 10 | Set-Content global.json
        Write-Host "✅ Đã cấu hình lại global.json cho môi trường CI/CD!" -ForegroundColor Cyan

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      # Nếu không có global.json, nó sẽ dùng SDK mới nhất trên runner
      with:
        global-json-file: ${{ hashFiles('global.json') != '' && 'global.json' || '' }} # Tự động đọc đúng SDK version bạn đã sửa

    - name: Install MAUI Workload
      run: dotnet workload install maui

    # ==========================================================
    # 2. Caching (Giúp các lần build sau nhanh gấp 3 lần)
    # ==========================================================
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    # ==========================================================
    # 3. Xử lý logic Build (Tự động nhận diện Keystore)
    # ==========================================================
    - name: Build and Publish Android
      shell: pwsh
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        # Dò tìm csproj bất kỳ trong thư mục để lấy TFM Android (Hỗ trợ cả MAUI và .NET tiêu chuẩn)
        $csproj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
        [xml]$xml = Get-Content $csproj.FullName
        $tfm = $xml.Project.PropertyGroup.TargetFrameworks -split ';' | Where-Object { $_ -match 'android' } | Select-Object -First 1
        
        Write-Host "🚀 Đang build với TFM: $tfm" -ForegroundColor Cyan

        # Sử dụng giá trị từ input người dùng chọn
        $format = "${{ github.event.inputs.package_format }}"
        if ([string]::IsNullOrWhiteSpace($format)) {
            $format = "apk" # Mặc định nếu không có input
        }
            
        Write-Host "📦 Định dạng mục tiêu: $format" -ForegroundColor Cyan

        $publishArgs = @(
            "publish",
            "-c", "Release",
            "-f", $tfm,
            "-p:AndroidPackageFormat=$format",
            "-p:PublishTrimmed=false",
            "-p:AndroidLinkMode=None"
        )

        # Kiểm tra nếu có Keystore thì thêm tham số ký (Signed)
        if (-not [string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            Write-Host "🔐 Phát hiện Keystore! Đang tiến hành ký bản build..." -ForegroundColor Green
            $bytes = [System.Convert]::FromBase64String($env:KEYSTORE_BASE64)
            [IO.File]::WriteAllBytes("android.keystore", $bytes)
            
            $publishArgs += "-p:AndroidSigningKeyStore=android.keystore"
            $publishArgs += "-p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            $publishArgs += "-p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            $publishArgs += "-p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}"
        } else {
            Write-Host "⚠️ Không có Keystore! Build bản Unsigned (chỉ để test)." -ForegroundColor Yellow
        }

        dotnet @publishArgs

    # ==========================================================
    # 4. Thu gom kết quả (Flattening)
    # ==========================================================
    - name: Organize Artifacts
      shell: pwsh
      run: |
        # 1. Tạo thư mục chứa kết quả
        $destDir = "publish-output"
        if (!(Test-Path $destDir)) {
            New-Item -ItemType Directory -Path $destDir -Force
        } 
        # 2. CHỈ QUÉT trong thư mục bin để tìm sản phẩm, tránh quét toàn bộ repo
        Write-Host "🔍 Đang gom file từ thư mục bin..." -ForegroundColor Cyan
        $files = Get-ChildItem -Path "bin" -File | Where-Object { $_.Extension -match 'apk|aab' }
        if ($files) {
            foreach ($file in $files) {
                Write-Host "🚚 Copying: $($file.FullName)" -ForegroundColor Gray
                Copy-Item -Path $file.FullName -Destination $destDir -Force
            }
            Write-Host "✅ Đã gom xong $($files.Count) file vào $destDir" -ForegroundColor Green
        } else {
            Write-Host "⚠️ Không tìm thấy file APK/AAB nào trong thư mục bin!" -ForegroundColor Yellow
            exit 1 # Thoát với lỗi để không tiếp tục upload nếu không có file nào
        }

    # ==========================================================
    # 5. Lưu trữ và Phát hành
    # ==========================================================
    - name: Upload Artifacts to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: android-release-files
        path: publish-output/*

    - name: Create GitHub Release
      if: success() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: 📦 Bản build tự động #${{ github.run_number }}
        body: |
          Dự án: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Thời gian: ${{ github.event.head_commit.timestamp }}
          Trạng thái: Build thành công ✅
        files: publish-output/*