name: Build MAUI Android
on:
  push:
    branches: [ "main" ] # Khi bạn lưu code lên branch main, nó sẽ tự chạy
  workflow_dispatch:     # Cho phép kích hoạt build bằng tay trên giao diện GitHub
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install MAUI
        run: dotnet workload install maui
      - name: Build App
        run: dotnet build -c Release -f net9.0-android
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: App-LamToanLop1
          path: "**/*.apk"
